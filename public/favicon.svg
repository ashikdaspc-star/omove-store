<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Blue C Ring -->
  <path d="M 240,80 A 150,150 0 1,0 260,380 L 260,310 A 80,80 0 1,1 240,150 Z" fill="url(#blueRingGrad)" filter="url(#glow)"/>

  <!-- Download Bag icon inside blue ring -->
  <g transform="translate(145, 165) scale(1.6)" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 10V20C6 21.1 6.9 22 8 22H24C25.1 22 26 21.1 26 20V10"/>
    <path d="M10 10C10 6.7 12.7 4 16 4C19.3 4 22 6.7 22 10"/>
    <path d="M16 11V17"/>
    <path d="M13 14L16 17L19 14"/>
  </g>

  <!-- White S Curve overlapping -->
  <path d="M 370,140 L 250,140 C 210,140 190,170 190,200 C 190,230 220,260 270,275 C 330,290 350,320 350,355 C 350,395 310,410 240,410 L 210,410 L 240,350 L 260,350 C 290,350 300,340 300,325 C 300,310 280,295 240,280 C 180,260 140,230 140,190 C 140,135 190,80 270,80 L 370,80 Z" fill="url(#whiteGrad)" />

  <!-- PC Monitor & Wrench icon -->
  <g transform="translate(285, 160) scale(1.5)" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="28" height="20" rx="3"/>
    <path d="M10 27H22"/>
    <path d="M16 23V27"/>
    <!-- Gear and Wrench inside monitor -->
    <path d="M18 10A3 3 0 1 0 18 16A3 3 0 1 0 18 10" stroke-width="2.5"/>
    <path d="M22 18L26 22" stroke-width="3"/>
  </g>
</svg>
